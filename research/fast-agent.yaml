default_model: $system.research
llm_retries: 5
git_aware: true

logger:
  type: console
  level: error
  truncate_tools: true

model_references:
  system:
    fast: hf.openai/gpt-oss-120b:cerebras
    research: hf.zai-org/GLM-5.2:zai-org
    html: hf.moonshotai/Kimi-K2.7-Code:novita?temperature=1.0&top_p=0.95&reasoning=on

mcp:
  servers:
    hf:
      description: Hugging Face MCP server
      transport: http
      url: https://huggingface.co/mcp?bouquet=research
      read_timeout_seconds: 30
      include_instructions: false
      auth:
        forward: huggingface

harness_app:
  entrypoint: research_app:create_app

default_environment: local
environments:
  local:
    type: local
    cwd: .
    env:
      RESEARCH_OUTPUT_DIR: research-output
