default_model: $system.default
git_aware: true

logger:
  type: console
  level: error
  truncate_tools: true

model_references:
  system:
    fast: gpt-oss
    last_used: codexresponses.gpt-5.5?reasoning=medium
    research: kimi26
    html: kimi27

mcp:
  servers:
    hf:
      description: Hugging Face MCP server
      transport: http
      url: https://huggingface.co/mcp?bouquet=research
      read_timeout_seconds: 30
      include_instructions: false
      auth:
        forward: huggingface
    hf_docs_only:
      description: Hugging Face MCP server, docs bouquet only
      transport: http
      url: https://huggingface.co/mcp?bouquet=docs
      auth:
        forward: huggingface

harness_app:
  entrypoint: research_app:create_app

default_environment: local
environments:
  local:
    type: local
    cwd: .
    env:
      RESEARCH_OUTPUT_DIR: research-output
