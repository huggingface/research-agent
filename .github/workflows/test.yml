name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --pre
          'fast-agent-mcp==0.10.2'
          prefab-ui==0.20.2
          hf-xet==1.5.2
          markdown==3.8.2
          latex2mathml==3.81.0
          bleach==6.2.0
          pytest==9.0.3
          pytest-asyncio==1.4.0
          ruff==0.15.16
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/build_deploy.py --output .build/ci-deploy
