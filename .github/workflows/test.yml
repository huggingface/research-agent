name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install --pre
          'fast-agent-mcp==0.10.2'
          prefab-ui==0.20.2
          hf-xet==1.5.2
          markdown==3.8.2
          latex2mathml==3.81.0
          bleach==6.2.0
          pytest==9.0.3
          pytest-asyncio==1.4.0
          ruff==0.15.16
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/build_deploy.py --output .build/ci-deploy
