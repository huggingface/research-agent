name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          pip install
          fast-agent-mcp==0.9.7
          'fastmcp[apps]'
          huggingface_hub
          pytest
          pytest-asyncio
      - run: python scripts/sync_deploy.py --check
      - run: pytest -q
